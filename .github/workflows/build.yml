name: Build Blocklist

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hostlist Compiler
        run: npm install -g @adguard/hostlist-compiler
        
      - name: Filter unreachable sources
        run: |
          cp hostlist-compiler-config.json config.filtered.json
          jq -r '.sources[].source' hostlist-compiler-config.json | while read -r url; do
            case "$url" in
              http*) ;;
              *) continue ;;
            esac
            if curl -fsSL --max-time 60 -o /dev/null "$url"; then
              echo "OK   $url"
            else
              echo "::warning::Skipped unreachable source: $url"
              jq --arg u "$url" '.sources |= map(select(.source != $u))' config.filtered.json > tmp.json
              mv tmp.json config.filtered.json
            fi
          done
          test "$(jq '.sources | length' config.filtered.json)" -gt 0
          
      - name: Compile blocklist
        run: hostlist-compiler -c config.filtered.json -o blocklist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist
          git diff --cached --quiet || git commit -m "Update blocklist"
          git push
